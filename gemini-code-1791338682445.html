<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>備品貸出管理アプリ (lendapp)</title>
  <!-- Tailwind CSS (UIデザイン用) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- 未ログイン画面 -->
  <div id="login-view" class="flex flex-col items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-xl shadow-md text-center max-w-sm w-full">
      <h1 class="text-2xl font-bold mb-6 text-slate-700">備品貸出管理</h1>
      <p class="text-sm text-slate-500 mb-6">利用するにはGoogleアカウントでログインしてください。</p>
      <button id="login-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 transition">
        Googleでログイン
      </button>
    </div>
  </div>

  <!-- ログイン後画面 -->
  <div id="app-view" class="hidden max-w-4xl mx-auto p-4 md:p-8">
    <!-- ヘッダー -->
    <header class="flex justify-between items-center mb-8 bg-white p-4 rounded-xl shadow-sm">
      <h1 class="text-xl font-bold text-slate-800">📦 備品貸出管理</h1>
      <div class="flex items-center gap-4">
        <span id="user-name" class="text-sm font-medium text-slate-600"></span>
        <button id="logout-btn" class="text-sm text-red-600 hover:text-red-800 font-medium">ログアウト</button>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <!-- 登録フォーム -->
      <section class="bg-white p-6 rounded-xl shadow-sm h-fit">
        <h2 class="text-lg font-bold mb-4 text-slate-700">貸出の記録</h2>
        <form id="item-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">備品名</label>
            <input type="text" id="itemName" required class="w-full border rounded-md p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="例: プロジェクター">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">借りた人の名前</label>
            <input type="text" id="borrower" required class="w-full border rounded-md p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="例: 山田 太郎">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">貸出日</label>
            <input type="date" id="startDate" required class="w-full border rounded-md p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">返却予定日</label>
            <input type="date" id="dueDate" required class="w-full border rounded-md p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">返却状況</label>
            <select id="status" class="w-full border rounded-md p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
              <option value="未返却">未返却</option>
              <option value="返却済み">返却済み</option>
            </select>
          </div>
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-md transition text-sm">
            登録する
          </button>
        </form>
      </section>

      <!-- 一覧表示 -->
      <section class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm">
        <h2 class="text-lg font-bold mb-4 text-slate-700">貸出一覧</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm border-collapse">
            <thead>
              <tr class="border-b text-slate-500 bg-slate-50">
                <th class="p-2">備品名</th>
                <th class="p-2">借用者</th>
                <th class="p-2">貸出日</th>
                <th class="p-2">返却予定</th>
                <th class="p-2">状況</th>
              </tr>
            </thead>
            <tbody id="item-list">
              <!-- Firestoreから読み込んだデータを動的生成 -->
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <!-- Firebase モジュール読み込み -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      updateDoc, 
      doc, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ ここをご自身のFirebaseプロジェクト設定に置き換えてください
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Firebase 初期化
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // DOM要素の取得
    const loginView = document.getElementById('login-view');
    const appView = document.getElementById('app-view');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userNameSpan = document.getElementById('user-name');
    const itemForm = document.getElementById('item-form');
    const itemList = document.getElementById('item-list');

    // 1. Google ログイン処理
    loginBtn.addEventListener('click', () => {
      signInWithPopup(auth, provider).catch(err => alert("ログインエラー: " + err.message));
    });

    // ログアウト処理
    logoutBtn.addEventListener('click', () => signOut(auth));

    // 2. 認証状態の監視（未ログイン時は操作不可に制御）
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginView.classList.add('hidden');
        appView.classList.remove('hidden');
        userNameSpan.textContent = user.displayName || user.email;
        loadItems(); // データ読み込み開始
      } else {
        loginView.classList.remove('hidden');
        appView.classList.add('hidden');
      }
    });

    // 3. データ登録処理 (Firestoreへ追加)
    itemForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const newItem = {
        itemName: document.getElementById('itemName').value,
        borrower: document.getElementById('borrower').value,
        startDate: document.getElementById('startDate').value,
        dueDate: document.getElementById('dueDate').value,
        status: document.getElementById('status').value,
        createdAt: new Date()
      };

      try {
        await addDoc(collection(db, "lendings"), newItem);
        itemForm.reset();
        // 本日の日付を再セット
        document.getElementById('startDate').valueAsDate = new Date();
      } catch (error) {
        alert("保存に失敗しました: " + error.message);
      }
    });

    // 4. データ一覧のリアルタイム取得・更新（再読み込みしても消えない）
    function loadItems() {
      const q = query(collection(db, "lendings"), orderBy("createdAt", "desc"));
      
      onSnapshot(q, (snapshot) => {
        itemList.innerHTML = "";
        snapshot.forEach((docSnapshot) => {
          const item = docSnapshot.data();
          const id = docSnapshot.id;

          const tr = document.createElement('tr');
          tr.className = "border-b text-slate-700 hover:bg-slate-50";
          
          const isReturned = item.status === "返却済み";
          const statusBadgeClass = isReturned 
            ? "bg-emerald-100 text-emerald-700" 
            : "bg-amber-100 text-amber-700";

          tr.innerHTML = `
            <td class="p-2 font-medium">${escapeHtml(item.itemName)}</td>
            <td class="p-2">${escapeHtml(item.borrower)}</td>
            <td class="p-2 text-slate-500">${item.startDate}</td>
            <td class="p-2 text-slate-500">${item.dueDate}</td>
            <td class="p-2">
              <button onclick="toggleStatus('${id}', '${item.status}')" class="px-2 py-1 rounded text-xs font-semibold ${statusBadgeClass}">
                ${item.status}
              </button>
            </td>
          `;
          itemList.appendChild(tr);
        });
      });
    }

    // 返却状況の切り替え（テーブル上のバッジクリックで更新可能）
    window.toggleStatus = async (id, currentStatus) => {
      const newStatus = currentStatus === "未返却" ? "返却済み" : "未返却";
      await updateDoc(doc(db, "lendings", id), { status: newStatus });
    };

    // XSS対策のエスケープ処理
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      })[m]);
    }

    // デフォルト日付の設定
    document.getElementById('startDate').valueAsDate = new Date();
  </script>
</body>
</html>
